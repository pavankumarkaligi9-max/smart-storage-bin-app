version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: smartstoragebin_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smartstoragebin
      MYSQL_USER: storageuser
      MYSQL_PASSWORD: storagepass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build: .
    container_name: smartstoragebin_api
    restart: always
    depends_on:
      mysqldb:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/smartstoragebin?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: storageuser
      SPRING_DATASOURCE_PASSWORD: storagepass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

volumes:
  db_data:
